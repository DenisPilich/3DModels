name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No token: the job authenticates with a short-lived OIDC credential that
      # npm exchanges for a publish grant (trusted publishing). Nothing to leak
      # and nothing to rotate.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Use the npm version that supports trusted publishing
        run: npm install --global npm@latest

      - run: npm ci

      - name: Check the tag matches the package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${expected}" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      # prepublishOnly runs typecheck, tests and a build once more, so a broken
      # commit can never reach the registry, whatever the tag says.
      #
      # The trusted publisher grants "npm stage publish" only: CI can prepare a
      # release but never ship it. A maintainer approves it with 2FA, which is
      # the flow npm recommends instead of long-lived publish tokens.
      #
      # npm errors are surfaced as annotations too: the job log is only visible
      # to signed-in users, while annotations are readable through the API.
      - name: Stage the release
        run: |
          set +e
          npm stage publish --provenance --access public > publish.log 2>&1
          status=$?
          cat publish.log
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(tail -n 12 publish.log)
          fi
          exit "$status"

      - name: Where to approve
        if: success()
        run: |
          echo "::notice::Staged, not published. Approve it with 2FA: https://www.npmjs.com/package/glb-doctor (Staged releases), or run: npm stage approve <id>"
