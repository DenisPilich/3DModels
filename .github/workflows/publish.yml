name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check the tag matches the package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${expected}" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      # prepublishOnly runs typecheck, tests and a build once more, so a broken
      # commit can never reach the registry, whatever the tag says.
      #
      # npm errors are surfaced as annotations too: the job log is only visible
      # to signed-in users, while annotations are readable through the API.
      - name: Publish
        run: |
          set +e
          npm publish --provenance --access public > publish.log 2>&1
          status=$?
          cat publish.log
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(tail -n 12 publish.log)
          fi
          exit "$status"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
