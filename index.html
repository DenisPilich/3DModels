<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>glb-doctor — diagnose glTF & GLB files</title>
    <meta
      name="description"
      content="Drop a .glb file and see what is inside: triangle counts, texture sizes, wasted bytes and actionable warnings. Runs entirely in your browser."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0e14'/%3E%3Cpath d='M16 7v18M7 16h18' stroke='%2334d399' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
          </svg>
        </span>
        <span class="brand-name">glb<span class="brand-dot">·</span>doctor</span>
        <span class="brand-tagline">glTF diagnostics in your browser</span>
      </a>

      <div class="actions">
        <a class="ghost" href="https://github.com/DenisPilich/glb-doctor" target="_blank" rel="noreferrer noopener">GitHub</a>
        <button class="primary" id="open-file" type="button">Open file</button>
        <input id="file-input" type="file" accept=".glb,model/gltf-binary" hidden />
      </div>
    </header>

    <main>
      <section class="stage">
        <canvas id="viewport"></canvas>

        <div class="hud" id="hud" hidden>
          <span class="hud-name" id="hud-name"></span>
          <span class="hud-size" id="hud-size"></span>
          <span class="hud-tip">drop another file to reload</span>
        </div>

        <div class="dropzone" id="dropzone">
          <div class="dropzone-inner">
            <div class="drop-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="30" height="30">
                <path
                  d="M12 16V5m0 0L7.5 9.5M12 5l4.5 4.5M5 15v2.5A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5V15"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <h1>Drop a .glb file</h1>
            <p>Parsed locally. Nothing is uploaded, ever.</p>
            <button class="primary" id="load-sample" type="button">Try the sample model</button>
            <span class="dropzone-hint">or press <kbd>Ctrl</kbd> + <kbd>O</kbd></span>
          </div>
        </div>
      </section>

      <aside class="panel" id="panel" aria-live="polite"></aside>
    </main>

    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
